plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs "src/main/java"
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.23.1'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.23.1'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j-impl', version: '2.23.1'
    implementation group: 'com.fasterxml.woodstox', name: 'woodstox-core', version: '7.0.0'
    implementation group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '4.0.2'
    implementation group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.1.0'
    implementation group: 'org.glassfish.jersey.core', name: 'jersey-client', version: '3.1.7'
    implementation group: 'org.glassfish.jersey.containers', name: 'jersey-container-servlet', version: '3.1.6'
    implementation group: 'org.glassfish.jersey.media', name: 'jersey-media-multipart', version: '3.1.7'
    implementation group: 'org.glassfish.jaxb', name: 'jaxb-runtime', version: '4.0.5'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.15.0'
    implementation group: 'commons-io', name: 'commons-io', version: '2.16.1'
    implementation group: 'org.activiti', name: 'activiti-engine', version: '7.1.0.M6'
    implementation group: 'org.activiti', name: 'activiti-bpmn-layout', version: '7.1.0.M6'
    implementation group: 'net.java.dev.msv', name: 'msv-core', version: '2022.7'
    implementation group: 'net.java.dev.msv', name: 'msv-rngconverter', version: '2022.7'
    implementation group: 'net.java.dev.msv', name: 'xsdlib', version: '2022.7'
    implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.6'
    implementation group: 'org.javatuples', name: 'javatuples', version: '1.2'
    implementation group: 'org.uma.jmetal', name: 'jmetal', version: '6.6'
    implementation group: 'org.uma.jmetal', name: 'jmetal-problem', version: '6.6'
    implementation group: 'org.uma.jmetal', name: 'jmetal-component', version: '6.6'
    implementation group: 'org.json', name: 'json', version: '20250107'
    //implementation group: 'org.moeaframework', name: 'moeaframework', version: '4.5'
}

task(main, dependsOn: 'classes', type: JavaExec) {
    println("Java version: " + JavaVersion.current())
    main = 'main/Main'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'main.Main'
    }
}